<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=https://peroza.github.io/personal-website/">
  <link rel="canonical" href="https://peroza.github.io/personal-website/">
  <script>
    var target = "https://peroza.github.io/personal-website/" + location.search + location.hash;
    location.replace(target);
  </script>
</head>
<body>
  <p>This site moved to <a href="https://peroza.github.io/personal-website/">peroza.github.io/personal-website</a>.</p>
</body>
</html>
